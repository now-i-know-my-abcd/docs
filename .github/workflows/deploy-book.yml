
name: deploy-book

# Only run this when the master branch changes
on:
  push:
    branches:
      - main
    # If your git repository has the Jupyter Book within some-subfolder next to
    # unrelated files, you can make this run only if a file within that specific
    # folder has been modified.
    #
    paths:
      - docs/**
      - python/news/**
      - .github/workflows/deploy-book.yml
  # Rebuild weekly (Mondays 12:00 UTC) so the News page stays current
  schedule:
    - cron: "0 12 * * 1"
  # Allow manual runs from the Actions tab
  workflow_dispatch:

jobs:
  # This job installs dependencies, builds the book, and pushes it to gh-pages
  deploy-book:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Install py dependencies with txt file
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install py dependencies not with conda cuz we suck
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Run the code tutorial scripts
      # must cd into the folder bc the paths in the scripts
      # are relative from the script path
      # and python is sensitive to the dir from which
      # the script is called
      - name: Run externalized py tutorial scripts
        run: |
          cd python/docs-examples
          for f in *.py; do python "$f"; done


      # Regenerate the News page from Europe PMC, OpenAlex, and Bluesky.
      # Fails soft: if this step errors, the committed docs/news.md is used.
      # Optional repo secrets BSKY_HANDLE / BSKY_APP_PASSWORD make the
      # Bluesky hashtag search authenticated (more reliable).
      - name: Build news page
        continue-on-error: true
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: python python/news/build_news.py

      - name: Debug docs folder
        run: |
          pwd
          ls -R docs
          
          
      - name: Build the book
        run: |
          jupyter-book build docs
          
      - name: Check build output
        run: ls -R docs/_build/html || echo "_build/html does not exist!"          

      - name: GitHub Pages action
        uses: peaceiris/actions-gh-pages@v3.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/_build/html


    # Push the book's HTML to github-pages
